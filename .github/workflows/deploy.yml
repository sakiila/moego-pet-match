name: Deploy to RackNerd

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moego-pet-match-production
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Compute game version from Git
        id: game-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node web/scripts/game-version.mjs)"
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'Game version: `%s`\n' "$version" >> "$GITHUB_STEP_SUMMARY"
      - name: Image name and immutable release tag
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$image:sha-$GITHUB_SHA-run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push application
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tag }}
          build-args: |
            GAME_VERSION=${{ steps.game-version.outputs.value }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # 运行凭据从不作为 build-arg 或构建文件传入。
          provenance: false
          sbom: false
          cache-from: type=gha,scope=moego-pet-match
          cache-to: type=gha,mode=max,scope=moego-pet-match

  deploy:
    needs: build
    # 准备期只构建镜像；SSH、迁移与反代就绪后设置仓库变量 DEPLOY_ENABLED=true。
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      HOST: ${{ secrets.HOST }}
      HOST_USERNAME: ${{ secrets.HOST_USERNAME }}
      HOST_SSHKEY: ${{ secrets.HOST_SSHKEY }}
      HOST_KNOWN_HOSTS: ${{ secrets.HOST_KNOWN_HOSTS }}
      HOST_PORT: ${{ vars.HOST_PORT || '22' }}
      IMAGE: ${{ needs.build.outputs.image }}
      DEPLOY_DIR: /app/moego-pet-match
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Transfer deployment files and update application
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HOST" =~ ^[a-zA-Z0-9.-]+$ ]] || { echo 'Invalid or missing HOST'; exit 1; }
          [[ "$HOST_USERNAME" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo 'Invalid or missing HOST_USERNAME'; exit 1; }
          [[ "$HOST_PORT" =~ ^[0-9]{1,5}$ ]] && (( 10#$HOST_PORT > 0 && 10#$HOST_PORT < 65536 )) || exit 1
          [[ -n "$HOST_SSHKEY" && -n "$HOST_KNOWN_HOSTS" ]] || { echo 'Missing SSH key or verified known_hosts'; exit 1; }
          ssh_dir="$RUNNER_TEMP/pet-match-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$HOST_SSHKEY" > "$ssh_dir/key"
          printf '%s\n' "$HOST_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          unset HOST_SSHKEY HOST_KNOWN_HOSTS
          ssh-keygen -y -P '' -f "$ssh_dir/key" > /dev/null
          ssh_opts=(-i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=8)
          destination="$HOST_USERNAME@$HOST"
          incoming="$DEPLOY_DIR/incoming-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup() {
            ssh -p "$HOST_PORT" "${ssh_opts[@]}" "$destination" "rm -rf -- '$incoming'" || true
            rm -rf -- "$ssh_dir"
          }
          trap cleanup EXIT
          ssh -p "$HOST_PORT" "${ssh_opts[@]}" "$destination" "umask 077; mkdir -p -- '$incoming'"
          scp -P "$HOST_PORT" "${ssh_opts[@]}" deploy/compose.yml deploy/deploy.sh "$destination:$incoming/"
          # 临时 GITHUB_TOKEN 通过 stdin 登录；Docker 登录文件只存本次 incoming 目录，结束即删除。
          printf '%s' "$GHCR_TOKEN" | ssh -p "$HOST_PORT" "${ssh_opts[@]}" "$destination" \
            "set -eu; umask 077; export DOCKER_CONFIG='$incoming/docker-config'; trap 'rm -rf -- \"\$DOCKER_CONFIG\"' EXIT; mkdir -p -- \"\$DOCKER_CONFIG\"; docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin >/dev/null; bash '$incoming/deploy.sh' '$IMAGE' '$DEPLOY_DIR'"
      - name: Record deployed image
        env:
          DEPLOYED_IMAGE: ${{ needs.build.outputs.image }}
        run: |
          printf 'Deployed image: `%s`\n' "$DEPLOYED_IMAGE" >> "$GITHUB_STEP_SUMMARY"
