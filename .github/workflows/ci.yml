name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15.8
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pet_match_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pet_match_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            server/package-lock.json
      - name: Install web dependencies
        run: npm ci --prefix web --no-audit --no-fund
      - name: Install server dependencies
        run: npm ci --prefix server --no-audit --no-fund
      - name: Typecheck web
        run: npm run typecheck --prefix web
      - name: Typecheck server
        run: npm run typecheck --prefix server
      - name: Test web
        run: npm test --prefix web
      - name: Test server against local PostgreSQL
        run: npm test --prefix server
      - name: Build web
        run: npm run build --prefix web
      - name: Bundle server
        run: npm run bundle --prefix server
      - name: Check deployment scripts
        run: |
          bash -n deploy/deploy.sh deploy/deploy.test.sh
          bash deploy/deploy.test.sh
