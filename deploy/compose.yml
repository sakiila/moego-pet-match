# DMIT 上的示例编排：容器只监听宿主机本地端口，由现有反向代理提供 HTTPS 并转发。
# 用法：把镜像与本文件、production.env 放到服务器同一目录，docker compose up -d。
services:
  pet-match:
    image: moego-pet-match:${PET_MATCH_VERSION:-latest}
    restart: unless-stopped
    env_file: production.env
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      # 图片缓存（可随时删除重建，上限约 1.5 GB，按最近使用淘汰）
      - pet-match-img-cache:/var/cache/pet-match/img
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pet-match-img-cache:
